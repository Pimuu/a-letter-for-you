<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>จดหมายถึงเบบี๋ 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Itim&family=Sriracha&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   จดหมายถึงเบบี๋ — a slow, soft little love book
   Self-contained: every decoration is drawn into this file. Works on any
   link and on GitHub Pages with NO other files needed.
   Edit the CONFIG object inside <script> near the bottom.
   ========================================================================= */

:root{
  --cream:#f6efe2; --cream-2:#efe6d4; --paper:#fffdf7;
  --ink:#5a4a3b; --ink-soft:#8a7762;
  --kraft:#7c5a3e; --kraft-dark:#5f4330; --kraft-light:#916a49;
  --pink:#f3b4c4; --pink-deep:#e2869f; --gold:#e6b64a; --red:#bb4a40;
  --tape:rgba(234,214,132,.5); --shadow:rgba(90,66,45,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:'Itim',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%, #fbf5ea 0%, var(--cream) 45%, var(--cream-2) 100%);
  overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

/* soft breathing ambient glow — slow + emotional */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.55), rgba(246,239,226,0) 62%);
  animation:breathe 8s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.7}}

/* white→beige bloom used between scenes */
#flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%, #fffdf9 0%, #f6efe2 68%, #efe6d4 100%);}

#decor{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.float{position:absolute;opacity:0;animation:floatUp linear forwards;}
@keyframes floatUp{0%{opacity:0;transform:translateY(20px) scale(.6) rotate(0)}14%{opacity:var(--o,.7)}88%{opacity:var(--o,.7)}100%{opacity:0;transform:translateY(-110vh) scale(1) rotate(var(--r,20deg))}}
.petal{position:absolute;top:-40px;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}12%{opacity:.9}100%{opacity:0;transform:translateY(112vh) translateX(var(--dx,0)) rotate(540deg)}}

.scene{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;opacity:0;visibility:hidden;transform:scale(.985);
  transition:opacity 1.2s ease, transform 1.2s ease, visibility 1.2s;}
.scene.active{opacity:1;visibility:visible;transform:scale(1);}

/* ---------- SCENE 1 : envelope ---------- */
.stage{perspective:1400px;}
.envelope{position:relative;width:min(78vw,320px);height:min(55vw,224px);cursor:pointer;
  transition:transform .6s ease;filter:drop-shadow(0 18px 24px var(--shadow));}
.envelope:active{transform:scale(.98);}
.env-back{position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(160deg,var(--kraft-light),var(--kraft) 55%,var(--kraft-dark));}
.env-stars{position:absolute;inset:0;border-radius:12px;overflow:hidden;z-index:1;}
.env-stars span{position:absolute;color:var(--gold);opacity:.85;text-shadow:0 1px 0 rgba(0,0,0,.15);}
.letter{position:absolute;left:8%;top:-6%;width:84%;height:96%;z-index:2;background:var(--paper);border-radius:8px;
  box-shadow:0 6px 14px rgba(90,66,45,.2);transition:transform 1.7s cubic-bezier(.22,.7,.2,1);
  display:flex;align-items:center;justify-content:center;padding:14px;}
.letter .mini{font-family:'Sriracha',cursive;font-size:28px;color:var(--pink-deep);}
.env-pocket{position:absolute;left:0;bottom:0;width:100%;height:68%;z-index:3;
  background:linear-gradient(175deg,var(--kraft),var(--kraft-dark));border-radius:0 0 12px 12px;
  clip-path:polygon(0 32%,50% 0,100% 32%,100% 100%,0 100%);}
.env-flap{position:absolute;left:0;top:0;width:100%;height:58%;z-index:6;transform-origin:top center;
  transition:transform 1.5s ease, z-index 0s .75s;background:linear-gradient(185deg,var(--kraft-light),var(--kraft) 80%);
  clip-path:polygon(0 0,100% 0,50% 100%);box-shadow:0 3px 6px rgba(0,0,0,.12);}
.seal{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:46px;height:46px;z-index:7;
  display:flex;align-items:center;justify-content:center;transition:opacity .8s ease, transform .8s ease;}
.envelope.open{cursor:default;}
.envelope.open .env-flap{transform:rotateX(-178deg);z-index:1;}
.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4);}
.envelope.open .letter{transform:translateY(-62%) scale(1.04);z-index:8;}

.tagline{font-family:'Sriracha',cursive;margin-top:32px;color:var(--ink-soft);}
.tagline .big{display:block;font-size:clamp(24px,6.5vw,32px);color:var(--ink);}
.hint{margin-top:8px;font-size:clamp(15px,4vw,18px);animation:pulse 2.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.heart-ico{color:var(--pink-deep);}

/* ---------- paper card ---------- */
.card{position:relative;background:var(--paper);width:min(90vw,440px);border-radius:14px;padding:30px 24px 32px;
  box-shadow:0 16px 30px var(--shadow), 0 2px 0 rgba(0,0,0,.03);
  background-image:linear-gradient(transparent 31px, rgba(140,120,90,.06) 32px);background-size:100% 32px;}
.card::before,.card::after{content:"";position:absolute;width:92px;height:28px;top:-13px;
  background:repeating-linear-gradient(90deg,var(--tape) 0 7px, rgba(234,214,132,.32) 7px 14px);
  box-shadow:0 1px 3px rgba(0,0,0,.08);clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);}
.card::before{left:12px;transform:rotate(-7deg);}
.card::after{right:12px;transform:rotate(6deg);}
.progress{font-family:'Sriracha',cursive;font-size:18px;color:var(--pink-deep);margin:0 0 6px;}
.q-text{font-family:'Itim',sans-serif;font-size:clamp(20px,5.2vw,25px);margin:4px 0 22px;color:var(--ink);line-height:1.5;}
.options{display:flex;flex-direction:column;gap:12px;}
.opt{font-family:'Itim',sans-serif;font-size:clamp(17px,4.4vw,20px);padding:13px 16px;
  border:1.6px solid #dcae9b;border-radius:30px;background:#fffef9;color:var(--ink);cursor:pointer;
  transition:transform .3s ease, background .5s, border-color .5s;}
.opt:hover{background:#fff6ef;}
.opt:active{transform:scale(.98);}
.opt.correct{background:#eef4ea;border-color:#b7cfa6;color:#5a7a48;}
.opt.wrong{animation:shake .5s;border-color:#e0b6b1;background:#fbf0ef;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:20px;margin-top:14px;font-family:'Sriracha',cursive;font-size:18px;color:var(--pink-deep);}

/* scrapbook stickers */
.deco{position:absolute;z-index:5;pointer-events:none;filter:drop-shadow(0 4px 5px rgba(0,0,0,.13));}
.d-bow{width:68px;top:-33px;left:50%;transform:translateX(-50%) rotate(-3deg);}
.d-tag{width:64px;top:-24px;right:-18px;transform:rotate(12deg);}
.d-button{width:38px;bottom:-15px;left:-13px;transform:rotate(-8deg);}
.d-flower{width:48px;bottom:-20px;right:-10px;transform:rotate(10deg);}
.d-star{width:32px;top:42%;left:-20px;transform:rotate(-6deg);}
@media(max-width:360px){.d-tag,.d-star{display:none;}}

/* ---------- passcode reveal ---------- */
.scraps{display:flex;gap:12px;justify-content:center;margin:24px 0 12px;flex-wrap:wrap;}
.scrap{width:58px;height:70px;background:#fffef8;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:'Gochi Hand',cursive;font-size:34px;color:var(--red);box-shadow:0 6px 12px rgba(90,66,45,.18);
  position:relative;opacity:0;transform:translateY(16px) rotate(var(--rot,0deg));animation:popIn .9s forwards;}
.scrap::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-4deg);width:42px;height:16px;
  background:repeating-linear-gradient(90deg,var(--tape) 0 6px, rgba(234,214,132,.3) 6px 12px);}
@keyframes popIn{to{opacity:1;transform:translateY(0) rotate(var(--rot,0deg))}}

/* ---------- keypad ---------- */
.dots{display:flex;gap:16px;justify-content:center;margin:12px 0 26px;}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--kraft);background:transparent;transition:background .4s, transform .4s;}
.dot.filled{background:var(--pink-deep);border-color:var(--pink-deep);transform:scale(1.1);}
.dots.err{animation:shake .5s;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(74vw,280px);margin:0 auto;}
.key{font-family:'Gochi Hand',cursive;font-size:26px;color:var(--ink);background:#fffef9;border:1.6px solid #e0cdb5;
  border-radius:16px;height:62px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 0 #e5d7c1;transition:transform .1s, box-shadow .1s;}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #e5d7c1;}
.key.fn{font-size:18px;font-family:'Itim';color:var(--ink-soft);}

/* ---------- final letter ---------- */
.final-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;max-height:100vh;overflow-y:auto;padding:34px 16px 64px;width:100%;}
.final-wrap::-webkit-scrollbar{display:none;}
.loveletter{position:relative;background:var(--paper);width:min(92vw,460px);border-radius:12px;padding:36px 28px;text-align:left;
  box-shadow:0 18px 36px var(--shadow);transform:rotateX(90deg);transform-origin:top;opacity:0;}
.loveletter.show{animation:unfold 1.7s cubic-bezier(.22,.7,.2,1) forwards;}
@keyframes unfold{to{transform:rotateX(0);opacity:1}}
.loveletter h2{font-family:'Sriracha',cursive;font-size:27px;margin:0 0 18px;color:var(--pink-deep);}
.loveletter p{font-family:'Itim',sans-serif;font-size:clamp(16px,4.3vw,18px);line-height:1.95;margin:0 0 16px;color:var(--ink);}
.loveletter .sign{font-family:'Sriracha',cursive;font-size:22px;color:var(--ink);text-align:right;margin-top:10px;}
.polaroid{background:#fff;padding:12px 12px 44px;border-radius:4px;box-shadow:0 12px 24px rgba(90,66,45,.25);
  transform:rotate(-4deg);width:min(62vw,230px);position:relative;}
.polaroid .photo{width:100%;aspect-ratio:1/1;border-radius:2px;overflow:hidden;background:#d9cbb6;position:relative;}
.polaroid .photo img,.polaroid .photo video{width:100%;height:100%;object-fit:cover;filter:blur(16px) brightness(.7);transform:scale(1.1);opacity:0;
  transition:filter 3.4s ease, opacity 1.6s ease, transform 3.4s ease;}
.polaroid .photo img.dev,.polaroid .photo video.dev{filter:blur(0) brightness(1);opacity:1;transform:scale(1);}
.polaroid .photo .ph-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;}
.polaroid .cap{position:absolute;bottom:12px;left:0;width:100%;text-align:center;font-family:'Sriracha',cursive;font-size:19px;color:var(--ink);}
.countdown{background:#fff7ef;border:1.6px dashed var(--pink);border-radius:16px;padding:18px 22px;width:min(88vw,400px);box-shadow:0 10px 20px var(--shadow);}
.countdown .lbl{font-family:'Sriracha',cursive;font-size:19px;color:var(--ink-soft);margin-bottom:8px;}
.countdown .num{font-family:'Sriracha',cursive;font-size:clamp(30px,9vw,40px);color:var(--pink-deep);line-height:1.1;}
.countdown .sub{font-family:'Itim';font-size:15px;color:var(--ink-soft);margin-top:8px;}
.replay{margin-top:10px;background:transparent;border:none;font-family:'Itim';font-size:16px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;}

.music-btn{position:fixed;top:16px;right:16px;z-index:50;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.8);
  border:1.6px solid #e0cdb5;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 4px 10px var(--shadow);backdrop-filter:blur(4px);}
.burst{position:fixed;left:50%;top:50%;font-size:20px;pointer-events:none;z-index:40;will-change:transform,opacity;}
@keyframes burstFly{to{opacity:0;transform:translate(var(--bx),var(--by)) scale(.4) rotate(var(--br))}}
</style>
</head>
<body>

<!-- reusable SVG stickers -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="svg-bow" viewBox="0 0 80 56">
    <path d="M40 28 C28 10 8 8 6 20 C4 32 20 36 40 28Z" fill="#c75246"/>
    <path d="M40 28 C52 10 72 8 74 20 C76 32 60 36 40 28Z" fill="#b2473c"/>
    <path d="M38 30 C30 44 24 52 20 54 L30 48 C36 44 40 36 40 30Z" fill="#a83f35"/>
    <path d="M42 30 C50 44 56 52 60 54 L50 48 C44 44 40 36 40 30Z" fill="#9c382f"/>
    <circle cx="40" cy="28" r="8" fill="#8f342c"/><ellipse cx="37" cy="25" rx="3" ry="2" fill="#d98a80" opacity=".6"/>
  </symbol>
  <symbol id="svg-tag" viewBox="0 0 70 92">
    <path d="M10 14 L60 14 L60 86 L10 86 Z" fill="#c79a6d"/><path d="M10 14 L35 2 L60 14 Z" fill="#b98a5c"/>
    <circle cx="35" cy="16" r="5" fill="#6b4f3a"/>
    <path d="M35 16 C30 30 48 34 42 50" stroke="#e7d7bf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="18" y1="40" x2="52" y2="40" stroke="#9c7850" stroke-width="2" opacity=".5"/>
    <line x1="18" y1="52" x2="52" y2="52" stroke="#9c7850" stroke-width="2" opacity=".5"/>
  </symbol>
  <symbol id="svg-button" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="22" fill="#c0493f"/><circle cx="24" cy="24" r="22" fill="none" stroke="#9c382f" stroke-width="2"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="#8f342c" stroke-width="2"/>
    <circle cx="19" cy="20" r="2.4" fill="#6e241d"/><circle cx="29" cy="20" r="2.4" fill="#6e241d"/>
    <circle cx="19" cy="28" r="2.4" fill="#6e241d"/><circle cx="29" cy="28" r="2.4" fill="#6e241d"/>
    <path d="M19 20 L29 28 M29 20 L19 28" stroke="#f0e2c8" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="svg-flower" viewBox="0 0 60 60">
    <g fill="#f3b4c4"><ellipse cx="30" cy="13" rx="9" ry="12"/><ellipse cx="47" cy="25" rx="9" ry="12" transform="rotate(72 47 25)"/>
    <ellipse cx="40" cy="45" rx="9" ry="12" transform="rotate(144 40 45)"/><ellipse cx="20" cy="45" rx="9" ry="12" transform="rotate(216 20 45)"/>
    <ellipse cx="13" cy="25" rx="9" ry="12" transform="rotate(288 13 25)"/></g><circle cx="30" cy="30" r="9" fill="#e6b64a"/>
  </symbol>
  <symbol id="svg-star" viewBox="0 0 48 48">
    <path d="M24 2 L30 18 L47 18 L33 28 L38 45 L24 34 L10 45 L15 28 L1 18 L18 18 Z" fill="#e6b64a" stroke="#cf9e35" stroke-width="1"/>
  </symbol>
  <symbol id="svg-seal" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="22" fill="url(#sealg)"/><circle cx="24" cy="24" r="17" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
    <path d="M24 32 C16 26 16 18 22 18 C24 18 24 20 24 20 C24 20 24 18 26 18 C32 18 32 26 24 32Z" fill="#fff" opacity=".9"/>
    <radialGradient id="sealg" cx="35%" cy="30%"><stop offset="0%" stop-color="#f3a9ba"/><stop offset="100%" stop-color="#e2869f"/></radialGradient>
  </symbol>
</defs></svg>

<div id="ambient"></div>
<div id="decor"></div>
<div id="flash"></div>
<button class="music-btn" id="musicBtn" title="เพลง">🔇</button>
<audio id="bgm" loop preload="none">
  <!-- OPTIONAL: ใส่ไฟล์ชื่อ song.mp3 ไว้ข้างๆไฟล์นี้ เพื่อให้มีเพลง (ใช้เพลงที่มีสิทธิ์นะ) -->
  <source src="song.mp3" type="audio/mpeg" />
</audio>

<!-- SCENE 1 : ENVELOPE -->
<section class="scene active" id="scene-envelope">
  <div class="stage">
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-stars" id="envStars"></div>
      <div class="letter"><div class="mini">♡</div></div>
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="seal"><svg width="46" height="46"><use href="#svg-seal"/></svg></div>
    </div>
  </div>
  <div class="tagline">
    <span class="big" id="openTitle">จดหมายน้อยๆ ถึงเบบี๋</span>
    <span class="hint">แตะเพื่อเปิดน้า <span class="heart-ico">♡</span></span>
  </div>
</section>

<!-- SCENE 2 : QUIZ -->
<section class="scene" id="scene-quiz">
  <div class="card" id="quizCard">
    <svg class="deco d-bow"><use href="#svg-bow"/></svg>
    <svg class="deco d-tag"><use href="#svg-tag"/></svg>
    <svg class="deco d-button"><use href="#svg-button"/></svg>
    <svg class="deco d-flower"><use href="#svg-flower"/></svg>
    <svg class="deco d-star"><use href="#svg-star"/></svg>
    <p class="progress" id="progress"></p>
    <p class="q-text" id="qText"></p>
    <div class="options" id="options"></div>
    <p class="feedback" id="feedback"></p>
  </div>
</section>

<!-- SCENE 3 : PASSCODE REVEAL -->
<section class="scene" id="scene-reveal">
  <div class="card">
    <svg class="deco d-bow"><use href="#svg-bow"/></svg>
    <svg class="deco d-flower"><use href="#svg-flower"/></svg>
    <p class="progress">เบบี๋เก่งมาก ♡</p>
    <p class="q-text">นี่คือรหัสของเรา</p>
    <div class="scraps" id="scraps"></div>
    <p class="feedback" id="revealCap"></p>
    <div class="options"><button class="opt" id="toKeypad" style="text-align:center;">กดรหัสเลย →</button></div>
  </div>
</section>

<!-- SCENE 4 : KEYPAD -->
<section class="scene" id="scene-keypad">
  <div class="card">
    <p class="progress">อีกนิดเดียว ♡</p>
    <p class="q-text">ใส่รหัสเพื่อเปิดจดหมายน้า</p>
    <div class="dots" id="dots"></div>
    <div class="keypad" id="keypad"></div>
    <p class="feedback" id="keyFeedback"></p>
  </div>
</section>

<!-- SCENE 5 : FINAL LETTER -->
<section class="scene" id="scene-final">
  <div class="final-wrap">
    <div class="loveletter" id="loveletter">
      <h2 id="letterGreet"></h2>
      <div id="letterBody"></div>
      <p class="sign" id="letterSign"></p>
    </div>
    <div class="polaroid">

  letterParagraphs: [

const $ = s => document.querySelector(s);
const scenes = { env:$("#scene-envelope"), quiz:$("#scene-quiz"), reveal:$("#scene-reveal"),
  keypad:$("#scene-keypad"), final:$("#scene-final") };
function show(n){ Object.values(scenes).forEach(s=>s.classList.remove("active")); scenes[n].classList.add("active"); }

/* slow white→beige bloom between scenes */
const flash=$("#flash");
function transitionTo(name){
  flash.style.transition="opacity 1s ease"; flash.style.opacity="1";
  setTimeout(()=>show(name), 1000);
  setTimeout(()=>{ flash.style.transition="opacity 1.5s ease"; flash.style.opacity="0"; }, 1300);
}

$("#openTitle").textContent = CONFIG.envelopeTitle;
$("#revealCap").textContent = CONFIG.revealCaption;
$("#polaroidCap").textContent = CONFIG.polaroidCaption;
$("#cdLabel").textContent = CONFIG.countdownLabel;

/* gold stars on envelope */
(function(){ const box=$("#envStars"); const m=["✦","✧","★","·"];
  for(let i=0;i<22;i++){ const s=document.createElement("span"); s.textContent=m[i%m.length];
    s.style.left=Math.random()*92+"%"; s.style.top=Math.random()*92+"%";
    s.style.fontSize=(8+Math.random()*8)+"px"; s.style.opacity=.5+Math.random()*.5; box.appendChild(s);} })();

/* floating hearts & flowers — gentle */
(function(){ const layer=$("#decor"); const g=["♡","♥","✦","🤍","🌸"];
  function spawn(){ const e=document.createElement("div"); e.className="float"; e.textContent=g[Math.floor(Math.random()*g.length)];
    const sz=10+Math.random()*18; e.style.left=Math.random()*100+"%"; e.style.bottom="-30px"; e.style.fontSize=sz+"px";
    e.style.color=Math.random()>.5?"var(--pink)":"var(--gold)"; e.style.setProperty("--o",(.3+Math.random()*.4).toFixed(2));
    e.style.setProperty("--r",(Math.random()*50-25)+"deg"); e.style.animationDuration=(12+Math.random()*9)+"s";
    layer.appendChild(e); setTimeout(()=>e.remove(),24000); }
  for(let i=0;i<8;i++) setTimeout(spawn,i*800); setInterval(spawn,1300); })();

/* falling petals in the final scene */
let petalTimer=null;
function startPetals(){ if(petalTimer) return; const layer=$("#decor"); const g=["🌸","🌷","🤍","💛","🌼"];
  petalTimer=setInterval(()=>{ const e=document.createElement("div"); e.className="petal";
    e.textContent=g[Math.floor(Math.random()*g.length)]; e.style.left=Math.random()*100+"%";
    e.style.fontSize=(14+Math.random()*16)+"px"; e.style.setProperty("--dx",(Math.random()*120-60)+"px");
    e.style.animationDuration=(8+Math.random()*6)+"s"; layer.appendChild(e); setTimeout(()=>e.remove(),15000); },700); }
function stopPetals(){ clearInterval(petalTimer); petalTimer=null; }

/* soft heart burst */
function burst(x,y,n=8){ for(let i=0;i<n;i++){ const h=document.createElement("div"); h.className="burst";
  h.textContent=Math.random()>.5?"♥":"♡"; h.style.left=x+"px"; h.style.top=y+"px";
  h.style.color=Math.random()>.5?"var(--pink-deep)":"var(--gold)";
  const a=Math.random()*Math.PI*2, d=50+Math.random()*100; h.style.setProperty("--bx",Math.cos(a)*d+"px");
  h.style.setProperty("--by",Math.sin(a)*d+"px"); h.style.setProperty("--br",(Math.random()*300-150)+"deg");
  h.style.animation="burstFly "+(1.2+Math.random()*0.8)+"s ease-out forwards"; document.body.appendChild(h);
  setTimeout(()=>h.remove(),2200);} }

/* music */
const bgm=$("#bgm"), musicBtn=$("#musicBtn"); let musicOn=false;
function tryMusic(){ if(musicOn) return; bgm.volume=.45; bgm.play().then(()=>{musicOn=true;musicBtn.textContent="🔊";}).catch(()=>{}); }
musicBtn.addEventListener("click",()=>{ if(musicOn){bgm.pause();musicOn=false;musicBtn.textContent="🔇";}
  else{bgm.play().then(()=>{musicOn=true;musicBtn.textContent="🔊";}).catch(()=>{});} });

/* SCENE 1 — open slowly */
const envelope=$("#envelope"); let opened=false;
envelope.addEventListener("click",()=>{ if(opened) return; opened=true; envelope.classList.add("open"); tryMusic();
  const r=envelope.getBoundingClientRect(); setTimeout(()=>burst(r.left+r.width/2, r.top+r.height/2, 8),400);
  setTimeout(()=>{ buildQuiz(); transitionTo("quiz"); }, 2400); });

/* SCENE 2 */
let qIndex=0;
function buildQuiz(){ qIndex=0; renderQuestion(); }
function renderQuestion(){ const item=CONFIG.questions[qIndex];
  $("#progress").textContent=`ข้อ ${qIndex+1} จาก ${CONFIG.questions.length}`;
  $("#qText").textContent=item.q; $("#feedback").textContent="";
  const box=$("#options"); box.innerHTML="";
  [...item.options].sort(()=>Math.random()-.5).forEach(txt=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=txt;
    b.addEventListener("click",()=>{
      if(txt===item.answer){ b.classList.add("correct"); const rr=b.getBoundingClientRect();
        burst(rr.left+rr.width/2, rr.top, 6);
        [...box.children].forEach(c=>c.style.pointerEvents="none");
        setTimeout(()=>{ qIndex++; if(qIndex<CONFIG.questions.length) renderQuestion(); else { buildReveal(); transitionTo("reveal"); } },1700);
      } else { b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"),500); }
    }); box.appendChild(b); });
}

/* SCENE 3 */
function buildReveal(){ const box=$("#scraps"); box.innerHTML="";
  CONFIG.passcode.split("").forEach((d,i)=>{ const s=document.createElement("div"); s.className="scrap"; s.textContent=d;
    s.style.setProperty("--rot",(Math.random()*10-5).toFixed(1)+"deg"); s.style.animationDelay=(i*0.4)+"s"; box.appendChild(s); }); }
$("#toKeypad").addEventListener("click",()=>{ buildKeypad(); transitionTo("keypad"); });

/* SCENE 4 */
let entered="";
function buildKeypad(){ entered=""; drawDots(); const pad=$("#keypad"); pad.innerHTML="";
  ["1","2","3","4","5","6","7","8","9","del","0","ok"].forEach(k=>{ const b=document.createElement("button");
    b.className="key"+(k==="del"||k==="ok"?" fn":""); b.textContent=k==="del"?"⌫":k==="ok"?"♡":k;
    b.addEventListener("click",()=>press(k)); pad.appendChild(b); }); }
function drawDots(){ const box=$("#dots"); box.innerHTML="";
  for(let i=0;i<CONFIG.passcode.length;i++){ const d=document.createElement("div");
    d.className="dot"+(i<entered.length?" filled":""); box.appendChild(d);} }
function press(k){ if(k==="del"){ entered=entered.slice(0,-1); drawDots(); return; } if(k==="ok"){ check(); return; }
  if(entered.length<CONFIG.passcode.length){ entered+=k; drawDots(); if(entered.length===CONFIG.passcode.length) setTimeout(check,450);} }
function check(){ if(entered===CONFIG.passcode){ $("#keyFeedback").textContent="";
    burst(window.innerWidth/2, window.innerHeight/2, 10); setTimeout(openFinal,900);
  } else { $("#dots").classList.add("err"); $("#keyFeedback").textContent="ลองอีกครั้งน้า ♡";
    setTimeout(()=>{$("#dots").classList.remove("err");entered="";drawDots();},650);} }

/* SCENE 5 */
function openFinal(){ $("#letterGreet").textContent=CONFIG.letterGreeting; const body=$("#letterBody"); body.innerHTML="";
  CONFIG.letterParagraphs.forEach(t=>{ const p=document.createElement("p"); p.textContent=t; body.appendChild(p); });
  $("#letterSign").textContent=CONFIG.letterSign;
  transitionTo("final");
  setTimeout(()=>{
    $("#loveletter").classList.add("show");
    const vid=$("#polaroidVid");
    vid.play().catch(()=>{});
    setTimeout(()=>vid.classList.add("dev"),900);
    startCountdown(); startPetals(); tryMusic();
    let c=0; const iv=setInterval(()=>{ burst(Math.random()*window.innerWidth,-10,3); if(++c>5)clearInterval(iv); },600);
  }, 1100);
}

function startCountdown(){ function upd(){ const now=new Date(); let t=new Date(CONFIG.reunionDate+"T00:00:00");
    if(t<now){ t.setFullYear(now.getFullYear()+1); } const diff=t-now;
    const days=Math.floor(diff/86400000), hrs=Math.floor((diff%86400000)/3600000);
    if(diff<=0){ $("#cdNum").textContent="วันนี้แล้ว! 🫶"; $("#cdSub").textContent="อยากเจอเบบี๋แล้ว ♡"; }
    else { $("#cdNum").textContent=days+" วัน"; $("#cdSub").textContent="อีก "+hrs+" ชั่วโมง ใกล้แล้วน้า ♡"; } }
  upd(); setInterval(upd,60000); }

$("#replay").addEventListener("click",()=>{ opened=false; envelope.classList.remove("open");
  $("#loveletter").classList.remove("show"); $("#keyFeedback").textContent=""; stopPetals(); transitionTo("env"); });
</script>
</body>
</html>
